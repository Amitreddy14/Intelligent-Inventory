# Intelligent Inventory Control & Demand Forecasting Platform
# SQL Server, one-shot initializer, FastAPI backend and the React dashboard.

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: inv-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Inventory@2026}"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Runs every db/0*.sql script once, then exits. Skips itself if the database is already seeded.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: inv-db-init
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Inventory@2026}"
    volumes:
      - ./db:/scripts:ro
    # tr strips Windows CR characters so the script runs even if git converted line endings
    entrypoint: ["/bin/bash", "-c", "tr -d '\\r' < /scripts/init.sh | bash"]
    restart: "no"

  # FastAPI backend (Phase 3). Interactive docs at http://localhost:8000/docs
  api:
    build: ./api
    container_name: inv-api
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DB_SERVER: "db,1433"
      DB_NAME: "InventoryDB"
      DB_USER: "sa"
      DB_PASSWORD: "${MSSQL_SA_PASSWORD:-Inventory@2026}"
      JWT_SECRET: "${JWT_SECRET:-change-this-demo-secret-to-something-long-32+}"
    ports:
      - "8000:8000"
    restart: unless-stopped

  # React dashboard served by nginx (Phase 4). Open http://localhost:3000
  web:
    build: ./web
    container_name: inv-web
    depends_on:
      - api
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  sqldata:
